<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>Smart Parking Dashboard</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background: #f8f9fa; }
        .video-box {
            text-align: center;
            margin-bottom: 20px;
        }
        .video-box img {
            border: 3px solid #333;
            border-radius: 8px;
            max-width: 100%;
            height: auto;
        }
        table {
            background: white;
            border-radius: 8px;
            overflow: hidden;
        }
        .status-available {
            color: green;
            font-weight: bold;
        }
        .status-unavailable {
            color: red;
            font-weight: bold;
        }
    </style>
</head>
<body>
<div class="container py-4">
    <h2 class="text-center mb-4">🚗 Smart Parking Dashboard</h2>

    <!-- Video Stream -->
    <div class="video-box">
        <img src="{{ url_for('video_feed') }}" alt="Camera stream">
    </div>

    <!-- Parking Status Table -->
    <h4>Danh sách chỗ đỗ</h4>
    <table class="table table-striped text-center" id="parking-table">
        <thead class="table-dark">
            <tr>
                <th>Chỗ</th>
                <th>Trạng thái</th>
                <th>Biển số</th>
            </tr>
        </thead>
        <tbody>
            <!-- Dữ liệu sẽ được load qua AJAX -->
        </tbody>
    </table>
</div>

<!-- JS: Fetch parking status -->
<script>
async function loadParkingStatus() {
    try {
        let res = await fetch("/parking_status");
        let data = await res.json();

        let tbody = document.querySelector("#parking-table tbody");
        tbody.innerHTML = "";

        for (let slot in data) {
            let status = data[slot].status;
            let plate = data[slot].plate || "-";

            let row = `
                <tr>
                    <td>${slot}</td>
                    <td class="${status === 'available' ? 'status-available' : 'status-unavailable'}">
                        ${status === 'available' ? 'Còn trống' : 'Đã chiếm'}
                    </td>
                    <td>${plate}</td>
                </tr>
            `;
            tbody.innerHTML += row;
        }
    } catch (err) {
        console.error("Lỗi load parking status:", err);
    }
}

// Refresh mỗi 3 giây
setInterval(loadParkingStatus, 3000);
loadParkingStatus();
</script>
</body>
</html>
